<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Benim Web Sitem</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .kart {
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        p {
            font-size: 20px;
            color: #ddd;
            margin-bottom: 30px;
        }

        .buton {
            display: inline-block;
            background: #00c6ff;
            color: white;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 30px;
            transition: 0.3s;
        }

        .buton:hover {
            background: #0072ff;
            transform: scale(1.05);
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>

<body>

    <div class="kart">
        <h1>Merhaba! 👋</h1>

        <p>
            Benim web siteme hoş geldin.
            Burayı birlikte geliştirebiliriz! 🚀
        </p>

        <a class="buton" href="https://github.com/" target="_blank">
            GitHub Profilim
        </a>

        <footer>
            © 2026 Benim Web Sitem
        </footer>
    </div>

</body>
</html>
